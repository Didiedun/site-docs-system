<!doctype html>
<html lang="ms">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — Halaman Tidak Dijumpai · Sistem Dokumen Tapak</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32.png"
    />
    <meta name="theme-color" content="#7a0c2e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Sora:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: #f6f5f3;
        color: #25212a;
        font-family: "Public Sans", sans-serif;
      }
      main {
        width: 100%;
        max-width: 520px;
      }
      img {
        width: 48px;
        height: 48px;
        object-fit: contain;
        margin-bottom: 22px;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.12em;
      }
      .code {
        font-size: clamp(70px, 12vw, 130px);
        font-weight: 600;
        letter-spacing: -0.08em;
        color: #85223f;
        margin: 28px 0;
        line-height: 1.1;
      }
      h1 {
        font-size: clamp(26px, 3vw, 36px);
        letter-spacing: -0.04em;
      }
      p {
        font-size: 14px;
        color: #69616b;
        line-height: 1.8;
      }
      .btn {
        display: inline-block;
        margin-top: 16px;
        background: #7a0c2e;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        padding: 14px 20px;
        font-size: 13px;
      }
      .btn:hover {
        background: #5c0a23;
      }
      .btn:focus-visible {
        outline: 3px solid #7a0c2e;
        outline-offset: 4px;
      }
      .help {
        font-size: 12px;
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/utm-logo.png" alt="UTM" />
      <p class="eyebrow">SISTEM DOKUMEN TAPAK</p>
      <div class="code" aria-hidden="true">404</div>
      <h1>Halaman tidak dijumpai.</h1>
      <p>
        Pautan ini mungkin telah berubah. Kembali ke ringkasan untuk meneruskan
        kerja anda.
      </p>
      <a class="btn" href="/#dashboard">Kembali ke ringkasan</a>
      <p class="help">Jika masalah berulang, hubungi pentadbir sistem.</p>
    </main>
  </body>
</html>
