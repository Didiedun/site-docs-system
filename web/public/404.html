<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>404 — Halaman Tidak Dijumpai · Sistem Dokumen Tapak</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
<meta name="theme-color" content="#7a0c2e" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
<style>
  :root{--maroon:#7a0c2e;--maroon-d:#5c0a23;--gold:#c9a24b;--ink:#1d1b1a;--muted:#6b6560;--line:#e6e0d8;--paper:#f6f3ee}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'Public Sans',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#f6f3ee 0%,#ede8e0 100%);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 48px rgba(122,12,46,.13);max-width:440px;width:100%;text-align:center;overflow:hidden}
  .band{background:linear-gradient(180deg,var(--maroon) 0%,var(--maroon-d) 100%);padding:30px 0 22px}
  .logo{width:72px;height:72px;background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
  .logo img{max-width:52px;max-height:36px;object-fit:contain}
  .band h1{font-family:'Sora',sans-serif;font-size:17px;color:#fff;margin:0;font-weight:700}
  .band p{color:rgba(255,255,255,.75);font-size:12px;margin:4px 0 0}
  .gold{height:3px;background:var(--gold)}
  .body{padding:30px 32px 34px}
  .code{font-family:'Sora',sans-serif;font-weight:800;font-size:64px;line-height:1;color:var(--maroon);letter-spacing:-.02em}
  .head{font-family:'Sora',sans-serif;font-weight:700;font-size:17px;margin:10px 0 6px}
  .lead{color:var(--muted);font-size:13.5px;line-height:1.6;margin:0 0 22px}
  .btn{display:inline-block;background:var(--maroon);color:#fff;text-decoration:none;padding:12px 22px;border-radius:11px;font-weight:700;font-size:14px}
  .btn:hover{background:var(--maroon-d)}
  .foot{margin-top:18px;color:var(--muted);font-size:11px}
  .foot b{color:var(--maroon)}
</style>
</head>
<body>
  <div class="card">
    <div class="band">
      <div class="logo"><img src="/utm-logo.png" alt="UTM" /></div>
      <h1>Sistem Dokumen Tapak</h1>
      <p>UTM · Jabatan TNC (Pembangunan)</p>
    </div>
    <div class="gold"></div>
    <div class="body">
      <div class="code">404</div>
      <div class="head">Halaman Tidak Dijumpai</div>
      <p class="lead">Maaf, halaman yang anda cari tidak wujud atau telah dipindahkan.</p>
      <a class="btn" href="/">Kembali ke Dashboard</a>
      <div class="foot">Dibangunkan oleh <b>Daniel Dun</b> untuk <b>Hadirah</b></div>
    </div>
  </div>
</body>
</html>
