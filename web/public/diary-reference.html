<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Harian Tapak Bina — 30 Mei 2026</title>
<style>
  :root{
    --ink:#16181d; --line:#3a3f47; --muted:#5b626d; --band:#1f2329; --tick:#0b6b2f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:#6b7280;font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink);}
  .toolbar{position:sticky;top:0;display:flex;gap:10px;justify-content:center;padding:12px;background:#2b2f36;z-index:9;}
  .toolbar button{font:600 13px/1 "Helvetica Neue",Arial;padding:9px 16px;border:0;border-radius:6px;background:#f3c34a;color:#1f2329;cursor:pointer;}
  .toolbar span{color:#cfd3da;font-size:12px;align-self:center;}

  .page{
    width:210mm;min-height:297mm;margin:18px auto;background:#fff;padding:9mm 8mm;
    box-shadow:0 10px 40px rgba(0,0,0,.35);
  }
  .frame{border:1.4px solid var(--line);}
  .b{border:1px solid var(--line);}
  .bt{border-top:1px solid var(--line);} .bl{border-left:1px solid var(--line);}
  .bb{border-bottom:1px solid var(--line);} .br{border-right:1px solid var(--line);}

  /* header */
  .head{display:flex;align-items:center;gap:10px;padding:2px 2px 8px;}
  .logo{width:54px;height:54px;border:1px dashed #b9bdc4;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 9px/1.1 Arial;color:#8a2a2a;text-align:center;}
  .dept{font-size:10.5px;color:#222;line-height:1.25;}
  .dept b{font-size:15px;letter-spacing:.5px;}
  .refcode{margin-left:auto;font-size:8px;color:#9aa0a8;text-align:right;}

  .tajuk{display:flex;font-size:10px;line-height:1.3;}
  .tajuk .lab{padding:5px 6px;font-weight:700;white-space:nowrap;}
  .tajuk .val{padding:5px 6px;font-weight:700;}
  .note{font-size:8.5px;font-style:italic;color:var(--muted);padding:3px 4px;}

  .titlebar{display:flex;align-items:stretch;}
  .titlebar .t{flex:1;background:var(--band);color:#fff;font:800 17px/1 "Helvetica Neue",Arial;letter-spacing:.5px;display:flex;align-items:center;padding:0 10px;font-style:italic;}
  .titlebar .dt{width:150px;font-size:10px;}
  .titlebar .dt div{display:flex;}
  .titlebar .dt .k{font-weight:700;padding:4px 6px;width:54px;}
  .titlebar .dt .v{padding:4px 6px;flex:1;}
  .titlebar .bil{width:96px;display:flex;align-items:center;font:800 13px/1 Arial;padding:0 8px;}
  .titlebar .bil .v{margin-left:6px;font-weight:400;}

  .lab{font-size:9.5px;font-weight:700;}
  .secband{background:var(--band);color:#fff;font-size:9px;font-weight:700;letter-spacing:.4px;padding:3px 6px;}

  table{border-collapse:collapse;width:100%;}
  td,th{vertical-align:top;}

  .chk{display:inline-flex;width:11px;height:11px;border:1px solid var(--line);margin-right:5px;align-items:center;justify-content:center;font-size:9px;color:var(--tick);font-weight:800;line-height:1;}
  .row{display:flex;align-items:center;font-size:9.5px;padding:2px 0;}
  .cnt{border:1px solid var(--line);min-width:30px;height:14px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;margin-left:auto;}
  .fieldline{flex:1;border-bottom:1px solid #c4c8ce;margin:0 6px;height:13px;font-size:9px;display:flex;align-items:flex-end;}

  .main{display:grid;grid-template-columns:1.55fr 1fr;}
  .cell{padding:5px 6px;}
  .small{font-size:9px;}
  .muted{color:var(--muted);}
  .fill{color:#11233f;}

  .worklist{font-size:9px;line-height:1.45;margin:0;padding-left:14px;}
  .worklist li{margin:1px 0;}
  .timehdr{font-weight:700;font-size:9px;margin:3px 0 1px;}

  .twocol{display:grid;grid-template-columns:1fr 1fr;}
  .lower{display:grid;grid-template-columns:1.1fr 1fr 1fr;}
  .boxtitle{font-size:9px;font-weight:700;padding:3px 6px;border-bottom:1px solid var(--line);}
  .boxbody{padding:5px 6px;font-size:9px;line-height:1.4;min-height:64px;}
  .sugg{color:#8a5a00;}
  .statusgrid{font-size:9px;}
  .statusgrid td{border:1px solid var(--line);padding:3px 5px;}
  .signbox{height:60px;}
  .footnote{font-size:8px;color:var(--muted);font-style:italic;padding:4px 2px 0;}
  @media print{
    html,body{background:#fff;}
    .toolbar{display:none;}
    .page{margin:0;box-shadow:none;width:auto;padding:6mm;}
    @page{size:A4;margin:6mm;}
  }
</style>
</head>

      <div class="val">${diary.tajuk}</div>
    </div>

    <div class="titlebar bb">
      <div class="t">LAPORAN HARIAN TAPAK BINA</div>
      <div class="dt bl">
        <div class="bb"><div class="k br">TARIKH</div><div class="v fill">${diary.tarikh}</div></div>
        <div><div class="k br">HARI</div><div class="v fill">${diary.hari}</div></div>
      </div>
      <div class="bil bl">BIL:<span class="v">${diary.bil||""}</span></div>
    </div>

    <div class="main">
      <!-- LEFT -->
      <div class="br">
        <div class="twocol bb">
          <div class="cell br">
            <div class="lab" style="margin-bottom:3px">SKOP KERJA</div>
            ${skopRows}
          </div>
          <div class="cell">
            <div class="lab" style="text-align:center;margin-bottom:3px">CUACA</div>
            <div class="muted" style="font-size:7.5px;text-align:center;margin-bottom:3px">batalkan yang tidak berkenaan</div>
            <div class="small" style="margin:2px 0"><b>pagi</b> : ${cuacaOpts(diary.cuaca.pagi)}</div>
            <div class="small" style="margin:2px 0"><b>petang</b> : ${cuacaOpts(diary.cuaca.petang)}</div>
          </div>
        </div>

        <div class="secband">PERLAKSANAAN KERJA KONTRAKTOR DI TAPAK</div>
        <table>
          <tr>
            <td class="b lab" style="width:14%;padding:3px 5px">masa</td>
            <td class="b lab" style="padding:3px 5px">butiran kerja kontraktor</td>
            <td class="b lab" style="width:14%;padding:3px 5px">kuantiti</td>
            <td class="b lab" style="width:14%;padding:3px 5px">*kualiti/<br>spek</td>
          </tr>
          <tr>
            <td class="b" style="padding:4px 5px;font-size:9px">Pagi /<br>Petang</td>
            <td class="b" style="padding:4px 6px">${perlaksanaanBody}</td>
            <td class="b"></td>
            <td class="b" style="text-align:center;font-size:9px;color:var(--tick)">&#10003;</td>
          </tr>
        </table>
      </div>

      <!-- RIGHT -->
      <div>
        <div class="cell bb">
          <div class="lab" style="text-align:center;margin-bottom:4px">TENAGA KERJA</div>
          <div class="row"><span>penyelia di tapak</span><span class="cnt">${diary.tenaga.penyelia}</span></div>
          ${tenagaRows}
          <div class="row" style="font-weight:700;border-top:1px solid #c4c8ce;margin-top:3px;padding-top:3px"><span>Jumlah pekerja</span><span class="cnt">${diary.tenaga.total}</span></div>
        </div>

        <div class="cell bb">
          <div class="lab" style="text-align:center;margin-bottom:4px">JENTERA / MESIN</div>
          <table>${jenteraRows}</table>
          <div class="muted small" style="margin-top:3px">${diary.jentera.length?'':'Tiada direkodkan'}</div>
        </div>

        <div class="cell bb">
          <div class="lab" style="text-align:center;margin-bottom:4px">BAHAN BINAAN</div>
          <table>
            <tr><td class="lab small" style="padding:0 5px 2px">bahan</td><td class="lab small" style="padding:0 5px 2px">bil dibekal</td></tr>
            ${bahanRows}
          </table>
        </div>

        <div class="cell">
          <div class="lab" style="text-align:center;margin-bottom:4px">*PENGURUSAN TAPAK</div>
          ${pengurusanRows}
        </div>
      </div>
    </div>

    <!-- LOWER -->
    <div class="lower bt">
      <div class="br">
        <div class="boxtitle">CATATAN PENYELIA</div>
        <div class="boxbody">${catatanBody}</div>
      </div>
      <div class="br">

      </div>
      <div>

      </div>
      <div>
        <div class="boxtitle">**STATUS KERJA</div>
        <div style="padding:5px 6px">
          <table class="statusgrid">
            <tr><td rowspan="2" style="width:42%">peratus<br>kemajuan</td><td>rancang</td><td class="fill" style="width:26%">${diary.status.rancang}%</td></tr>
            <tr><td>sebenar</td><td class="fill">${diary.status.sebenar}%</td></tr>
            <tr><td rowspan="2">tempoh<br>bekerja</td><td>rancang</td><td class="fill">${diary.status.tempohRancang} hari</td></tr>
            <tr><td>sebenar</td><td>${diary.status.tempohSebenar||''} hari</td></tr>
          </table>
          <div class="sugg" style="font-size:7.5px;margin-top:3px">${diary.statusNote}</div>
        </div>
      </div>
    </div>

    <div class="bt" style="padding:4px 6px">
      <div class="lab">**KOMEN / ULASAN MINGGUAN <span class="muted" style="font-weight:400">(Pegawai Yang Bertanggungjawab)</span></div>
      <div style="height:46px;text-align:right;font-size:9px;color:var(--muted);padding-top:34px">................................<br>Tandatangan</div>
    </div>
  </div>
